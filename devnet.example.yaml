systems:
  netbox:
    base_url: http://localhost:8080
    verify_tls: false
    token: ${NETBOX_TOKEN}
  ise:
    base_url: https://ise.example.com
    verify_tls: false
    username: ${ISE_USERNAME}
    password: ${ISE_PASSWORD}

# Each feature is on by default. Set one to false to turn it off
features:
  ingest: true
  compliance: true
  ise_sync: true
  backups: true
  netbox_webhook: true

# The SMTP server of the report mails of the flows
# mail:
#   host: smtp.example.com
#   port: 587
#   security: starttls # starttls, tls or none
#   username: ${SMTP_USERNAME}
#   password: ${SMTP_PASSWORD}
#   sender: devnet@example.com
#   to: [netops@example.com]

provision:
  netbox:
    # NetBox runs in rootless Docker, so it reaches devnet-api through the host's LAN IP
    webhook_url: http://<host-lan-ip>:8000/api/v1/netbox/webhooks/device
