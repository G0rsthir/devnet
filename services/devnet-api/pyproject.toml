[project]
name = "devnet-api"
version = "0.1.0"
description = "HTTP API for devnet: receives webhooks and other requests"
readme = "README.md"
authors = [
    { name = "G0rsthir", email = "194412152+G0rsthir@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "devnet-config",
    "devnet-core",
    "fastapi[standard]>=0.150.0",
    "prefect-client>=3.9.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "system-netbox",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
devnet-api = 'devnet_api.cli:cli'

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []

