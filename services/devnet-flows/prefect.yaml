# Prefect deployments for the whole repo. Run `prefect deploy --all` from the repo root,
# so every entrypoint is relative to the root (e.g. flows/compliance.py:compliance).
name: devnet
prefect-version: 3.9.0

# Code is not built or uploaded anywhere: the process worker runs flows from the
# code baked into the devnet-automation image at /app.
build: null
push: null
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

# Shared settings, reused in deployments below via YAML anchors.
definitions:
  work_pools:
    process: &process
      name: worker-process  # create once: prefect work-pool create worker-process --type process
      job_variables: {}

deployments: []
