[project]
name = "network-automation"
version = "0.1.0"
description = "Network Automation"
requires-python = ">=3.13"
dependencies = [
    "devnet-api",
    "devnet-flows",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
# Members inherit these, so they don't need their own [tool.uv.sources]
devnet-api = { workspace = true }
devnet-flows = { workspace = true }
devnet-core = { workspace = true }
system-netbox = { workspace = true }
system-ise = { workspace = true }
devnet-config = { workspace = true }
domain-ingest = { workspace = true }

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "prek>=0.5.11",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["packages/*/src", "services/*/src"]
# codegen outputs
extend-exclude = [
    "packages/system-*/src/*/models/generated*", 
    "packages/system-*/models/**",
]


[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "I",  # isort
    "TID", # flake8-tidy-imports
]

ignore = [
    # line too long
    "E501"
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Use httpx2 instead"
"os.environ".msg = "Read settings from devnet-config"
"os.getenv".msg = "Read settings from devnet-config"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Import rules, checked by `uv run lint-imports`
[tool.importlinter]
# Installed workspace packages
root_packages = ["devnet_core", "system_netbox", "devnet_api", "devnet_flows", "devnet_config", "system_ise", "domain_ingest"]

[[tool.importlinter.contracts]]
name = "Layers: a layer imports only the layers below it"
type = "layers"
layers = [
    "devnet_api | devnet_flows",
    "devnet_config",
    "domain_ingest",
    "system_netbox | system_ise",
    "devnet_core",
]

[tool.mypy]
plugins = ['pydantic.mypy']

check_untyped_defs = true
# Mypy doesn't follow pydantic's @computed_field on a @property
disable_error_code = ["prop-decorator"]