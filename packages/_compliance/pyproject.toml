[project]
name = "compliance"
version = "0.1.0"
description = "Network compliance: collect device state, check it against NetBox."
readme = "README.md"
authors = [
    { name = "G0rsthir", email = "194412152+G0rsthir@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15.1",
    "devnet-core",
    "netutils>=1.19.2",
    "pydantic>=2.14.2",
    "system-netbox",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
devnet-core = { workspace = true }
system-netbox = { workspace = true }
