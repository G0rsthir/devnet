[project]
name = "ingest"
version = "0.1.0"
description = "Data ingestion: collect data and write it to NetBox and other systems."
readme = "README.md"
authors = [
    { name = "G0rsthir", email = "194412152+G0rsthir@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15.1",
    "devnet-core",
    "diffsync>=2.2.3",
    "pydantic>=2.14.1",
    "structlog>=26.1.0",
    "system-netbox",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
devnet-core = { workspace = true }
system-netbox = { workspace = true }
