[project]
name = "domain-ingest"
version = "0.1.0"
description = "Data ingestion: collect data and write it to NetBox and other systems."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "devnet-core",
    "diffsync>=2.2.3",
    "pydantic>=2.14.1",
    "system-ise",
    "system-netbox",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
