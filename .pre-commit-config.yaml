repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: unsupported
        require_serial: true
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --exit-non-zero-on-format
        language: unsupported
        require_serial: true
        types: [python]

      - id: lint-imports
        name: import contracts
        entry: uv run lint-imports
        language: unsupported
        pass_filenames: false
        types: [python]

      - id: uv-lock
        name: uv.lock up to date
        entry: uv lock --check
        language: unsupported
        pass_filenames: false
        files: (^|/)pyproject\.toml$|^uv\.lock$

      - id: deptry
        name: imports are declared dependencies
        entry: >-
          bash -c 'status=0; for p in packages/[!_]*/ services/*/; do
          (cd "$p" && uv run deptry src) || status=1;
          done; exit $status'
        language: unsupported
        pass_filenames: false
        files: \.py$|(^|/)pyproject\.toml$
